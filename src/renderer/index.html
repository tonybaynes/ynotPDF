<!doctype html>
<html lang="en-GB" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The app themes itself; never let a browser-level auto-dark feature repaint it.
      Each theme also declares its own `color-scheme` (see theme/tokens.css).
    -->
    <meta name="color-scheme" content="dark light" />
    <title>ynotPDF</title>
    <!--
      All four themes are linked at once and scoped by [data-theme]; ThemeManager switches by
      writing that attribute, so a change is instant with no stylesheet load and no flash.
    -->
    <link rel="stylesheet" href="./theme/tokens.css" />
    <link rel="stylesheet" href="./theme/graphite.css" />
    <link rel="stylesheet" href="./theme/midnight.css" />
    <link rel="stylesheet" href="./theme/daylight.css" />
    <link rel="stylesheet" href="./theme/high-contrast.css" />
    <link rel="stylesheet" href="./app/shell.css" />
    <link rel="stylesheet" href="./view/viewer.css" />
    <link rel="stylesheet" href="./modules/M12-navigation-panels/panels.css" />
    <link rel="stylesheet" href="./modules/M21-save/save.css" />
    <link rel="stylesheet" href="./modules/M13-select-find-print/select-find-print.css" />
    <link rel="stylesheet" href="./modules/M30-markup-annotations/annotations.css" />
    <link rel="stylesheet" href="./modules/M31-shapes-ink-stamps/shapes-ink-stamps.css" />
    <link rel="stylesheet" href="./modules/M40-organise-pages/organise.css" />
    <link rel="stylesheet" href="./modules/M91-create-pdf/create.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
