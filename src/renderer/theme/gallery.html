<!doctype html>
<html lang="en-GB" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Opt out of Chrome's "Auto Dark Mode for Web Contents" (chrome://flags). That feature
      re-darkens light-coloured elements at paint time, which would repaint the Daylight
      column and every white page sample — the exact colours this page exists to show.
      Declaring support for both schemes here tells Chrome the page handles its own theming.
      This meta tag is the reliable signal: it is parsed before any stylesheet loads.
    -->
    <meta name="color-scheme" content="dark light" />
    <title>ynotPDF theme gallery</title>
    <!--
      Development page (M01). Not part of the app bundle: it is served by `npm run gallery`
      so the operator can approve the four palettes. Every number on it comes from the same
      code the contrast test uses.
    -->
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./graphite.css" />
    <link rel="stylesheet" href="./midnight.css" />
    <link rel="stylesheet" href="./daylight.css" />
    <link rel="stylesheet" href="./high-contrast.css" />
    <link rel="stylesheet" href="./gallery.css" />
  </head>
  <body>
    <header>
      <h1>ynotPDF theme gallery</h1>
      <p>
        All four themes side by side. Every contrast number is computed by
        <code>theme/contrast.ts</code> — the same code the build-failing test uses.
      </p>
    </header>
    <main id="gallery"></main>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
