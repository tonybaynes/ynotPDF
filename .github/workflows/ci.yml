name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # Keep Electron/electron-builder caches OUTSIDE the workspace: package.json has
      # "type": "module", which would make Node treat electron-builder's CommonJS helper
      # scripts (icon-tool.js) as ESM. The `runner` context is not usable in `env:`.
      - name: Point Electron caches outside the workspace
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Linux packaging prerequisites (rpm, AppImage FUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2 xvfb

      - name: Install
        run: npm ci

      # M10: fonts for PDFium (inlined into the worker bundle) and the pinned pdf.js corpus for
      # the engine tests. Both are downloads with SHA-256 checks, cached between runs.
      - name: Cache fetched fonts and fixtures
        uses: actions/cache@v4
        with:
          path: |
            resources/fonts/*.ttf
            resources/fonts/LICENSE-*.txt
            resources/fonts/.*.sha256
            test/fixtures/external/*.pdf
          key: fetched-${{ hashFiles('resources/binaries.json', 'test/fixtures/external/manifest.json') }}

      - name: Fetch fonts and external fixtures
        run: |
          npm run fetch-binaries
          npm run fetch-fixtures

      - name: Lint (eslint, prettier, colour/opacity rules, tsc)
        run: npm run lint

      - name: Unit tests (vitest, coverage gate)
        run: npm test

      - name: Licence check (permissive only)
        run: npm run licenses

      - name: Build (electron-vite)
        run: npm run build

      - name: End-to-end (Playwright, Linux under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npx playwright test

      - name: End-to-end (Playwright)
        if: runner.os != 'Linux'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      # M03: Windows ships x64 and arm64. Cross-packaging arm64 on the x64 runner is
      # electron-builder's normal path — it downloads the arm64 Electron zip into the cache.
      - name: Package installers (electron-builder, unsigned)
        if: runner.os != 'Windows'
        run: npx electron-builder --publish never

      - name: Package installers, x64 and arm64 (electron-builder, unsigned)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --arm64 --publish never

      - name: Check the Windows job produced all four installers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          missing=0
          for f in '*-win-x64.exe' '*-win-arm64.exe' '*-win-x64.msi' '*-win-arm64.msi'; do
            if ! compgen -G "release/$f" > /dev/null; then
              echo "missing installer: release/$f"
              missing=1
            fi
          done
          ls -l release/*.exe release/*.msi
          exit $missing

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  # M03 / ADR 0009: prove the arm64 build actually runs on ARM hardware. GitHub's hosted
  # `windows-11-arm` runners are free for public repositories, which this one is. If the label is
  # ever withdrawn this job fails to start — the response is to delete it and say so in the ADR
  # and README, never to leave a job that silently skips.
  windows-arm:
    name: windows-11-arm (arm64 installer smoke)
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Point Electron caches outside the workspace
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Confirm the runner really is arm64
        shell: pwsh
        run: |
          "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'not an ARM64 runner' }

      # Playwright and Electron only; the app itself comes from the installer, not from a build.
      - name: Install
        run: npm ci

      - name: Download the Windows installers
        uses: actions/download-artifact@v5
        with:
          name: installers-windows-latest
          path: installers

      # `perMachine: false` only sets the *default*; the runner user is an admin, so an elevated
      # silent install still picks all-users and lands in C:\Program Files. `/currentuser` forces
      # the per-user install, and the install location is read back from the registry rather than
      # assumed — with both well-known paths as a fallback.
      - name: Install the arm64 build silently
        shell: pwsh
        run: |
          $exe = Get-ChildItem installers -Filter '*-win-arm64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no arm64 NSIS installer in the artifact' }
          "installing $($exe.Name)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"

          # electron-builder leaves InstallLocation empty, so DisplayIcon ("…\ynotPDF.exe,0") and
          # UninstallString ('"…\Uninstall ynotPDF.exe" /currentuser') are the ones that answer.
          function Get-Candidates {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            $out = @()
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              Get-ChildItem $root | ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
                Where-Object { $_.DisplayName -like 'ynotPDF*' } |
                ForEach-Object {
                  $dirs = @()
                  if ($_.InstallLocation) { $dirs += $_.InstallLocation }
                  if ($_.DisplayIcon) { $dirs += Split-Path ($_.DisplayIcon -replace ',\d+$', '') -Parent }
                  if ($_.UninstallString) {
                    $u = $_.UninstallString
                    if ($u -match '^"([^"]+)"') { $u = $Matches[1] }
                    $dirs += Split-Path $u -Parent
                  }
                  foreach ($d in $dirs) { if ($d) { $out += (Join-Path $d 'ynotPDF.exe') } }
                }
            }
            $out += "$env:LOCALAPPDATA\Programs\ynotPDF\ynotPDF.exe"
            $out += "$env:ProgramFiles\ynotPDF\ynotPDF.exe"
            return ($out | Select-Object -Unique)
          }

          # NSIS returns from the outer process before the inner one has finished writing files,
          # so the executable can lag the registry entry by a few seconds. Wait for it.
          $app = $null
          $deadline = (Get-Date).AddSeconds(180)
          do {
            $candidates = Get-Candidates
            $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($app) { break }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $app) {
            "candidates considered:"
            $candidates | ForEach-Object { "  $_" }
            foreach ($d in @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles")) {
              "--- $d ---"
              Get-ChildItem $d -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              $sub = Join-Path $d 'ynotPDF'
              if (Test-Path $sub) { "--- $sub ---"; Get-ChildItem $sub -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName }
            }
            # NSIS writes the registry entry only after extracting the app, so if the entry exists
            # and the files do not, something removed them — Defender quarantining an unsigned
            # Electron binary is the usual suspect until M131 signs the builds.
            "--- Defender detections ---"
            Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Select-Object -Last 10 InitialDetectionTime, Resources | Format-List
            throw 'installer did not produce ynotPDF.exe (see the listing above)'
          }
          "found: $app"
          "YNOT_E2E_EXECUTABLE=$app" >> $env:GITHUB_ENV

      # Drives the installed arm64 app. YNOT_EXPECT_ARCH makes the About dialog assert exactly
      # "Windows arm64" — emulated x64 would read "Windows x64 (emulated on arm64)" and fail.
      - name: Smoke the installed arm64 app (Playwright)
        env:
          YNOT_EXPECT_ARCH: arm64
        run: npx playwright test test/e2e/arch.spec.ts test/e2e/app.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-windows-11-arm
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
