# electron-builder configuration - M00 baseline. M131 adds signing, notarisation and auto-update.
appId: com.ynotpdf.app
productName: ynotPDF
copyright: Copyright 2026 Tony Baynes
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources/build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*', '!README.md']
asar: true
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: Portable Document Format
    mimeType: application/pdf
    role: Editor
win:
  # M03: Windows on ARM is a first-class target (PLAN.md 3.1, ADR 0009). Both architectures are
  # cross-packaged from the x64 CI runner; artifactName carries ${arch}, so the four files are
  # ynotPDF-<ver>-win-{x64,arm64}.{exe,msi}.
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: msi
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # One installer per architecture. The default (true) additionally emits a combined installer
  # carrying both app payloads, which doubles the download for no benefit here.
  buildUniversalInstaller: false
  # Refuses an arm64-only installer on a non-ARM64 PC; electron-builder has no such guard of its
  # own (ADR 0009 records what its NSIS templates actually do).
  include: resources/build/installer.nsh
msi:
  perMachine: false
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: false
  identity: null
linux:
  category: Office
  maintainer: Tony Baynes <tonybaynes@gmail.com>
  target:
    - AppImage
    - deb
    - rpm
  desktop:
    entry:
      MimeType: application/pdf
publish: null
